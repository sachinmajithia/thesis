<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hindi-Punjabi Translation &amp; Cross-Language Plagiarism Detection</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; }
  textarea { width: 100%; height: 100px; font-size: 16px; padding: 8px; box-sizing: border-box; }
  button { margin-top: 10px; padding: 8px 16px; font-size: 15px; cursor: pointer; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
  .card { flex: 1; min-width: 260px; border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
  .card h3 { margin-top: 0; }
  pre { white-space: pre-wrap; word-break: break-word; background: #f7f7f7; padding: 8px; border-radius: 4px; }
  label { font-size: 14px; }
</style>
</head>
<body>
  <h1>Hindi-Punjabi Translation + Cross-Language Plagiarism Detection</h1>
  <p>Enter Hindi text below. Translation runs in <strong>both modes</strong> (EBMT and NMT) and the
     best available result is used for cross-language plagiarism detection.</p>

  <textarea id="hindiText" placeholder="यहाँ हिंदी टेक्स्ट लिखें..."></textarea><br>
  <label><input type="checkbox" id="sentenceSearch" checked> Use sentence-based internet search</label><br>
  <button onclick="runCompare()">Compare Translation Modes</button>
  <button onclick="runPlagiarismCheck()">Run Plagiarism Check</button>

  <div class="row">
    <div class="card">
      <h3>EBMT Output</h3>
      <pre id="ebmtOut">-</pre>
    </div>
    <div class="card">
      <h3>NMT Output</h3>
      <pre id="nmtOut">-</pre>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h3>Result</h3>
    <pre id="resultOut">-</pre>
  </div>

<script>
async function runCompare() {
  const hindi_text = document.getElementById('hindiText').value;
  const res = await fetch('/api/translate/compare', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({hindi_text})
  });
  const data = await res.json();
  document.getElementById('ebmtOut').textContent = JSON.stringify(data.ebmt, null, 2);
  document.getElementById('nmtOut').textContent = JSON.stringify(data.nmt, null, 2);
  document.getElementById('resultOut').textContent = JSON.stringify(data, null, 2);
}

async function runPlagiarismCheck() {
  const hindi_text = document.getElementById('hindiText').value;
  const use_sentence_search = document.getElementById('sentenceSearch').checked;
  const res = await fetch('/api/plagiarism-check/text', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({hindi_text, use_sentence_search})
  });
  const data = await res.json();
  if (data.translation_modes) {
    document.getElementById('ebmtOut').textContent = JSON.stringify(data.translation_modes.ebmt, null, 2);
    document.getElementById('nmtOut').textContent = JSON.stringify(data.translation_modes.nmt, null, 2);
  }
  document.getElementById('resultOut').textContent = JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
